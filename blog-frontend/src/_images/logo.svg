<svg width="140" height="72" viewBox="0 0 140 72" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- One continuous gradient per bracket, shared by both arms -->
  <linearGradient id="leftGradient" x1="14" y1="14" x2="50" y2="58" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#00EBDD"/>
    <stop offset=".48" stop-color="#08C6F1"/>
    <stop offset="1" stop-color="#1268FF"/>
  </linearGradient>

  <linearGradient id="rightGradient" x1="126" y1="14" x2="90" y2="58" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#00EBDD"/>
    <stop offset=".48" stop-color="#08C6F1"/>
    <stop offset="1" stop-color="#1268FF"/>
  </linearGradient>

  <linearGradient id="slashGradient" x1="76" y1="8" x2="62" y2="64" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#00EBDD"/>
    <stop offset=".48" stop-color="#08C6F1"/>
    <stop offset="1" stop-color="#1268FF"/>
  </linearGradient>
</defs>

<!-- Each bracket is now ONE path, so there is no seam at the vertex -->
<path
  d="M47 14L17 35.5L47 57"
  stroke="url(#leftGradient)"
  stroke-width="9"
  stroke-linecap="round"
  stroke-linejoin="round"
/>

<path
  d="M76 9L62 63"
  stroke="url(#slashGradient)"
  stroke-width="9"
  stroke-linecap="round"
/>

<path
  d="M93 14L123 35.5L93 57"
  stroke="url(#rightGradient)"
  stroke-width="9"
  stroke-linecap="round"
  stroke-linejoin="round"
/>
</svg>