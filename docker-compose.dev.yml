version: "3.9"

services:
  blog-backend:
    build:
      context: ./blog-backend
      dockerfile: Dockerfile.dev
    container_name: blog-backend-dev
    ports:
      - "3000:3000"
    env_file:
      - ./blog-backend/.env
    volumes:
      - ./blog-backend:/app
      - /app/node_modules
    command: npm run start:dev
    depends_on:
      - blog-mongo

  blog-mongo:
    image: mongo:7
    container_name: blog-mongo-dev
    ports:
      - "27018:27017"
    volumes:
      - blog_mongo_data:/data/db

  blog-frontend:
    build:
      context: ./blog-frontend
      dockerfile: Dockerfile.dev
    container_name: blog-frontend-dev
    ports:
      - "3001:3000"
    env_file:
      - ./blog-frontend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./blog-frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - blog-backend

volumes:
  blog_mongo_data: